<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validasi Form + CrootJS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/crootjs/lib@0.0.32/croot.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="index.js"></script>
</head>
<body>

  <main class="card">
    <h1 class="center">Validasi Form + CrootJS</h1>
    <p class="lead center muted">
      <code>form.js</code>: pesan di bawah setiap field yang salah, dari atribut HTML biasa
      ditambah aturan sendiri. Coba kirim form kosong, lalu perbaiki satu per satu.
    </p>

    <form id="daftar">
      <div class="field">
        <label for="nama">Nama lengkap</label>
        <input id="nama" name="nama" required minlength="3" autocomplete="name">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="hp">Nomor HP</label>
        <input id="hp" name="hp" inputmode="numeric" required pattern="62[0-9]{9,13}"
               title="Awali dengan 62, contoh 6281234567890." autocomplete="tel">
      </div>

      <div class="field">
        <label for="sandi">Kata sandi</label>
        <input id="sandi" name="sandi" type="password" required minlength="8" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="ulang">Ulangi kata sandi</label>
        <input id="ulang" name="ulang" type="password" required autocomplete="new-password">
      </div>

      <fieldset class="field">
        <legend>Peran</legend>
        <label><input type="radio" name="peran" value="mahasiswa" required> Mahasiswa</label>
        <label><input type="radio" name="peran" value="dosen"> Dosen</label>
      </fieldset>

      <fieldset class="field">
        <legend>Minat (boleh lebih dari satu)</legend>
        <label><input type="checkbox" name="minat" value="web"> Web</label>
        <label><input type="checkbox" name="minat" value="gis"> GIS</label>
        <label><input type="checkbox" name="minat" value="3d"> 3D</label>
      </fieldset>

      <div class="field">
        <label><input type="checkbox" name="setuju" required> Saya setuju data ini dipakai untuk contoh</label>
      </div>

      <div class="actions cluster">
        <button type="submit">Daftar</button>
        <button type="button" id="isi" class="secondary">Isi contoh data</button>
      </div>
    </form>

    <h2 class="result-title">Data yang akan dikirim</h2>
    <pre id="hasil" class="result">Belum ada.</pre>
  </main>

</body>
</html>
